[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oodforge"
version = "0.1.0"
description = "OODForge — 分布外检测 (OOD) 与概率校准系统 (CPU / 离线可运行 / 一键可复现)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星 (CJX0712)" }]
keywords = ["ood", "out-of-distribution", "calibration", "anomaly", "machine-learning"]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
sota = ["netcal>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oodforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-W ignore::UserWarning"

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F401"]
